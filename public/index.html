<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FaithSteps - Discipulado Gamificado</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --bg: #0f1220; --panel: #161a2e; --panel2: #1d2238; --border: #2a2f45;
      --text: #e7e9f0; --muted: #9aa2c0; --purple: #7d5cff; --purple2: #a487ff;
      --green: #58cc02; --green-d: #46a302; --gold: #ffc800; --blue: #1cb0f6;
      --locked: #3a3f57;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    /* Header de gamificacao */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
      padding: 10px 18px; background: rgba(15,18,32,.95);
      backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 1.05rem; margin-right: auto; letter-spacing: .3px; }
    .brand img { width: 30px; height: 30px; display: block; }
    .brand span { color: var(--purple2); }
    .stat { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: .92rem; }
    .stat img { width: 22px; height: 22px; display: block; }
    .stat .ic { font-size: 1.05rem; }
    .stat.xp { color: var(--gold); }
    .stat.streak { color: #c9d2ec; }
    .stat.talents { color: var(--green); }
    .stat.bibles { color: var(--blue); }

    main { max-width: 720px; margin: 0 auto; padding: 18px; }

    /* Cartao do Discipulo + mascote peixe */
    .disciple {
      display: flex; align-items: center; gap: 16px;
      background: linear-gradient(135deg, #241a4a, #3a1b4a);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 16px 18px; margin-bottom: 18px;
    }
    .disciple .mascot { width: 68px; height: 68px; flex: 0 0 auto; }
    .disciple .info { flex: 1; min-width: 0; }
    .disciple .era { font-size: 1.15rem; font-weight: 800; }
    .disciple .sub { color: var(--muted); font-size: .85rem; margin-top: 2px; }
    .bar { height: 12px; background: var(--panel2); border-radius: 8px; overflow: hidden; margin-top: 12px; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--green-d)); border-radius: 8px; transition: width .5s; }
    .bar-label { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: 6px; }

    .section-title { font-size: 1rem; font-weight: 800; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }

    /* Abas de eixo (Biblia / Ingles) */
    .axis-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .axis-tab { flex: 1; text-align: center; padding: 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); font-weight: 700; font-size: .9rem; color: var(--muted); cursor: pointer; }
    .axis-tab.active { background: var(--purple); color: #fff; border-color: var(--purple); }
    .axis-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 18px 0 12px; }
    .axis-panel-copy { min-width: 0; }
    .axis-panel-head h2 { font-size: 1rem; margin-bottom: 4px; }
    .axis-panel-head p { color: var(--muted); font-size: .82rem; line-height: 1.4; }
    .placement-button { flex: 0 0 auto; border: 1px solid var(--purple); color: #fff; background: rgba(125,92,255,.18); border-radius: 10px; padding: 9px 12px; font-size: .78rem; font-weight: 800; cursor: pointer; transition: transform .16s, background .16s; }
    .placement-button:hover { background: var(--purple); }
    .placement-button:active { transform: scale(.97); }
    .book-pill { gap: 5px; }
    .book-pill small { color: inherit; opacity: .78; font-size: .68rem; font-weight: 600; }

    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); font-size: .82rem; color: var(--muted); cursor: pointer; }
    .pill.active { background: var(--purple); color: #fff; border-color: var(--purple); }
    .picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .picker-label { font-size: .78rem; color: var(--muted); margin: 8px 0 4px; }

    /* Trilha estilo Duolingo */
    .path { position: relative; padding: 10px 0 30px; }
    .node-row { display: flex; justify-content: center; margin: 10px 0; }
    .node-row:nth-child(odd) { transform: translateX(-64px); }
    .node-row:nth-child(even) { transform: translateX(64px); }
    .node {
      width: 74px; height: 74px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.05rem; cursor: pointer; position: relative;
      border: none; color: #17371a; background: var(--green);
      box-shadow: 0 6px 0 var(--green-d); transition: transform .1s, box-shadow .1s;
    }
    .node:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-d); }
    .node.done { background: var(--gold); box-shadow: 0 6px 0 #c99a00; color: #3a2c00; }
    .node.done img { width: 34px; height: 34px; }
    .node.locked { background: var(--locked); box-shadow: 0 6px 0 #23273a; color: #6b7290; cursor: not-allowed; }
    .node .check { position: absolute; top: -6px; right: -6px; background: #fff; color: var(--green-d); border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: .8rem; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
    .node-cap { text-align: center; font-size: .72rem; color: var(--muted); margin-top: 4px; }

    /* Trilhas tematicas */
    .theme-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
    .theme-card h4 { font-size: .95rem; margin-bottom: 4px; }
    .theme-card p { color: var(--muted); font-size: .82rem; margin-bottom: 8px; }
    .theme-refs { display: flex; gap: 6px; flex-wrap: wrap; }
    .ref-chip { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; font-size: .78rem; cursor: pointer; }
    .ref-chip:hover { border-color: var(--purple); }

    /* Badges */
    .badges { display: flex; gap: 10px; flex-wrap: wrap; }
    .badge { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: .82rem; display: flex; align-items: center; gap: 8px; }
    .empty { color: var(--muted); font-size: .85rem; }

    /* English placeholder */
    .english-box { background: var(--panel); border: 1px dashed var(--border); border-radius: 14px; padding: 22px; text-align: center; color: var(--muted); }

    /* Modal licao */
    .overlay { position: fixed; inset: 0; background: rgba(5,7,15,.7); display: none; align-items: center; justify-content: center; padding: 18px; z-index: 50; }
    .overlay.open { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 22px; width: 100%; max-width: 440px; max-height: 90vh; overflow: auto; }
    .modal h3 { font-size: 1.15rem; margin-bottom: 6px; }
    .modal .ref { color: var(--purple2); font-weight: 700; margin-bottom: 14px; }
    .modal p.q { font-size: .95rem; margin-bottom: 12px; }
    .modal .scripture { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; max-height: 200px; overflow: auto; font-size: .9rem; line-height: 1.55; }
    .modal .scripture-ref { color: var(--purple2); font-weight: 700; font-size: .8rem; margin-bottom: 6px; }
    .modal .ai-card { background: linear-gradient(135deg, #1a2540, #241a4a); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: .85rem; }
    .modal .ai-card .ai-tag { color: var(--blue); font-weight: 800; font-size: .78rem; margin-bottom: 6px; }
    .modal .ai-card p { margin-bottom: 6px; }
    .modal .ai-card .apply { color: var(--gold); }
    .modal .quiz-card { margin-top: 4px; }
    .placement-progress { color: var(--muted); font-size: .78rem; margin-bottom: 12px; }
    .placement-question { font-size: 1rem; font-weight: 750; line-height: 1.45; margin-bottom: 14px; }
    .placement-option { display: block; width: 100%; text-align: left; background: var(--panel2); border: 2px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; font-size: .9rem; transition: border-color .16s, background .16s, transform .16s; }
    .placement-option:hover { border-color: var(--purple); }
    .placement-option:active { transform: scale(.99); }
    .placement-option.sel { border-color: var(--blue); background: rgba(28,176,246,.12); }
    .placement-result { text-align: center; padding: 8px 0 4px; }
    .placement-result .level-mark { color: var(--gold); font-size: 2rem; font-weight: 900; margin: 6px 0 8px; }
    .placement-result p { color: var(--muted); line-height: 1.5; font-size: .9rem; }
    .axis-levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 12px 0 2px; }
    .axis-level { background: rgba(15,18,32,.28); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px 10px; min-width: 0; }
    .axis-level span { display: block; color: var(--muted); font-size: .72rem; margin-bottom: 3px; }
    .axis-level strong { display: block; color: #fff; font-size: .84rem; }
    .axis-level small { display: block; color: var(--muted); font-size: .7rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 520px) {
      .axis-panel-head { flex-direction: column; }
      .placement-button { width: 100%; }
      .axis-levels { grid-template-columns: 1fr; }
    }
    .muted { color: var(--muted); }
    .opt { display: block; width: 100%; text-align: left; background: var(--panel2); border: 2px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; font-size: .9rem; }
    .opt:hover { border-color: var(--purple); }
    .opt.sel { border-color: var(--blue); }
    .btn { width: 100%; background: var(--green); color: #123; font-weight: 800; border: none; border-radius: 14px; padding: 14px; font-size: 1rem; cursor: pointer; box-shadow: 0 5px 0 var(--green-d); }
    .btn:disabled { background: var(--locked); box-shadow: 0 5px 0 #23273a; color: #6b7290; cursor: not-allowed; }
    .btn.secondary { background: var(--panel2); color: var(--text); box-shadow: 0 5px 0 #12152a; margin-top: 8px; }

    .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: var(--green); color: #123; font-weight: 800; padding: 14px 20px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4); opacity: 0; transition: all .3s; z-index: 60; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .loading { text-align: center; color: var(--muted); padding: 40px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="/icons/lamp.svg" alt="" />Faith<span>Steps</span></div>
    <div class="stat streak" title="Ofensiva (constância na Palavra)"><img src="/icons/tablets.svg" alt="ofensiva" /><span id="t-streak">0</span></div>
    <div class="stat xp" title="Experiência"><img src="/icons/lamp.svg" alt="XP" /><span id="t-xp">0</span></div>
    <div class="stat talents" title="Talentos">🪙<span id="t-talents">0</span></div>
    <div class="stat bibles" title="Bíblias doadas">📖<span id="t-bibles">0</span></div>
  </div>

  <main>
    <div id="app"><div class="loading">Preparando sua jornada...</div></div>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h3 id="q-title">Capítulo</h3>
      <div class="ref" id="q-ref"></div>
      <div id="q-body"></div>
      <button class="btn" id="q-confirm" disabled>Concluir capítulo</button>
      <button class="btn secondary" id="q-skip">Ler sem quiz</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '';
    let ctx = {
      userId: null, challengeId: null, dashboard: null, tracks: null,
      axis: 'bible', section: null, book: null, current: null,
      placementLevels: {}, placement: null,
    };

    const PLACEMENT_QUESTIONS = {
      bible: [
        { question: 'Quantos livros compõem a Bíblia na tradição cristã protestante?', options: ['39', '66', '73', '1.189'], correctIndex: 1 },
        { question: 'Qual conjunto reúne os quatro Evangelhos?', options: ['Mateus, Marcos, Lucas e João', 'Romanos, Gálatas, Efésios e Filipenses', 'Gênesis, Êxodo, Levítico e Números', 'Salmos, Provérbios, Jó e Eclesiastes'], correctIndex: 0 },
        { question: 'Ao estudar um capítulo, qual prática ajuda a respeitar melhor seu contexto?', options: ['Ler apenas uma frase isolada', 'Ignorar quem escreveu e para quem foi escrito', 'Observar o contexto literário, histórico e a intenção do texto', 'Escolher a interpretação mais popular'], correctIndex: 2 },
        { question: 'Qual livro é conhecido por reunir muitos cânticos e orações?', options: ['Salmos', 'Atos', 'Apocalipse', 'Neemias'], correctIndex: 0 },
        { question: 'Uma leitura bíblica madura busca principalmente:', options: ['Vencer debates', 'Aplicar o texto com fidelidade, amor e discernimento', 'Memorizar números sem compreender', 'Substituir a comunidade por opiniões individuais'], correctIndex: 1 },
      ],
      english: [
        { question: 'In the Bible, the word “grace” is closest in meaning to:', options: ['Free and undeserved kindness', 'A difficult battle', 'A place to live', 'A musical instrument'], correctIndex: 0 },
        { question: 'Choose the sentence that means “Jesus ama seus discípulos”.', options: ['Jesus loved his disciples.', 'Jesus is loving his disciples yesterday.', 'Jesus love his disciples.', 'Jesus will loved his disciples.'], correctIndex: 0 },
        { question: 'What does “I have read the chapter” communicate?', options: ['I am going to read it tomorrow.', 'I finished reading it at some point before now.', 'I never opened the chapter.', 'I am writing the chapter.'], correctIndex: 1 },
        { question: 'In “Although the passage is difficult, I can understand it”, “although” introduces:', options: ['A contrast', 'A location', 'A quantity', 'A greeting'], correctIndex: 0 },
        { question: 'In a theological context, “sanctification” refers to:', options: ['The process of being made holy', 'The act of changing a book cover', 'A type of travel', 'The beginning of a meal'], correctIndex: 0 },
      ],
    };

    const PLACEMENT_LEVELS = {
      bible: [
        { level: 1, title: 'Aprendiz da Palavra', description: 'Fundamentos para cultivar o hábito de leitura e conhecer a narrativa bíblica.' },
        { level: 2, title: 'Discípulo Caminhante', description: 'Boa base para avançar pelos Evangelhos e aplicar a Palavra no cotidiano.' },
        { level: 3, title: 'Guardião da Palavra', description: 'Leitura consistente com atenção a contexto, prática e memorização.' },
        { level: 4, title: 'Mestre & Discipulador', description: 'Maturidade para estudar, interpretar e compartilhar a Palavra com outros.' },
        { level: 5, title: 'Expert & Exegeta', description: 'Visão ampla das Escrituras e discernimento para estudos mais profundos.' },
      ],
      english: [
        { level: 'A1/A2', title: 'Inglês essencial', description: 'Vocabulário fundamental e frases simples para começar a ler a Bíblia em inglês.' },
        { level: 'B1', title: 'Inglês intermediário', description: 'Compreensão de textos familiares e comunicação em situações do dia a dia.' },
        { level: 'B2', title: 'Inglês independente', description: 'Boa compreensão de textos teológicos intermediários e maior autonomia.' },
        { level: 'C1', title: 'Inglês avançado', description: 'Leitura fluente, análise de contexto e comunicação precisa em temas complexos.' },
        { level: 'C2', title: 'Inglês proficiente', description: 'Domínio avançado para interpretar e ensinar conteúdos bíblicos em inglês.' },
      ],
    };

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2600);
    }

    async function api(path, opts) {
      const res = await fetch(API + path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Object({ status: res.status, data });
      return data;
    }

    function readPlacementLevels(userId) {
      try {
        return JSON.parse(localStorage.getItem('fs_placement_' + userId) || '{}') || {};
      } catch (_) {
        return {};
      }
    }

    function savePlacementLevel(axis, result) {
      ctx.placementLevels[axis] = result;
      try {
        localStorage.setItem('fs_placement_' + ctx.userId, JSON.stringify(ctx.placementLevels));
      } catch (_) {
        // A jornada continua funcionando mesmo quando o armazenamento local está indisponível.
      }
    }

    function axisDefinition(axis) {
      const fallback = {
        bible: { name: 'Bíblia', description: 'Leitura e estudo da Palavra, dos 66 livros às trilhas temáticas.' },
        english: { name: 'Inglês', description: 'Aprendizado bilíngue de inglês usando a Bíblia como base.' },
      };
      return ((ctx.tracks && ctx.tracks.axes) || []).find(a => a.id === axis) || fallback[axis];
    }

    function placementLevelFor(axis, d) {
      const saved = ctx.placementLevels[axis];
      if (saved && saved.level) return saved;
      const level = axis === 'bible' ? d.discipleship.level : d.discipleship.englishLevel;
      const definition = (PLACEMENT_LEVELS[axis] || []).find(item => item.level === level);
      return { level, title: definition ? definition.title : 'Ainda não avaliado' };
    }

    // Onboarding: garante Discípulo + desafio; guarda o id no localStorage.
    async function bootstrap() {
      let userId = localStorage.getItem('fs_userId');
      const [seed, tracks] = await Promise.all([
        api('/api/dev/seed', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) }),
        api('/api/tracks').catch(() => null),
      ]);
      ctx.challengeId = seed.challenge.id;
      ctx.tracks = tracks;
      if (tracks && tracks.bible.sections.length) {
        ctx.section = tracks.bible.sections[0].id;
        ctx.book = tracks.bible.sections[0].books[0].usfm;
      }
      if (!userId) { userId = seed.user.id; localStorage.setItem('fs_userId', userId); }
      ctx.userId = userId;
      ctx.placementLevels = readPlacementLevels(userId);
      await refresh();
    }

    async function refresh() {
      const d = await api('/api/users/' + ctx.userId + '/dashboard');
      ctx.dashboard = d;
      renderTop(d);
      renderApp(d);
    }

    function renderTop(d) {
      document.getElementById('t-streak').textContent = d.user.currentStreak;
      document.getElementById('t-xp').textContent = d.user.totalXp;
      document.getElementById('t-talents').textContent = d.talents.balance;
      document.getElementById('t-bibles').textContent = d.talents.biblesDonated;
    }

    function readCountFor(d, usfm) {
      const b = (d.progress && d.progress.books || []).find(x => x.usfm === usfm);
      return b ? b.chaptersRead : 0;
    }

    function currentSection() {
      return ctx.tracks.bible.sections.find(s => s.id === ctx.section) || ctx.tracks.bible.sections[0];
    }
    function currentBook() {
      const sec = currentSection();
      return sec.books.find(b => b.usfm === ctx.book) || sec.books[0];
    }

    function renderApp(d) {
      const app = document.getElementById('app');
      const pct = d.progress ? d.progress.percentComplete : 0;
      const chaptersRead = d.progress ? d.progress.chaptersRead : 0;
      const total = d.totalBibleChapters;
      const bibleLevel = placementLevelFor('bible', d);
      const englishLevel = placementLevelFor('english', d);

      const disciple =
        '<div class="disciple">' +
          '<img class="mascot" src="/icons/fish.svg" alt="Mascote peixe" />' +
          '<div class="info">' +
            '<div class="era">Discípulo · ' + escapeHtml(d.discipleship.name) + '</div>' +
            '<div class="sub">Nível XP ' + escapeHtml(d.user.level) + ' · ' + chaptersRead + ' capítulos caminhados</div>' +
            '<div class="axis-levels" aria-label="Níveis por eixo">' +
              '<div class="axis-level"><span>📖 Bíblia</span><strong>Nível ' + escapeHtml(bibleLevel.level) + '</strong><small>' + escapeHtml(bibleLevel.title) + '</small></div>' +
              '<div class="axis-level"><span>🔤 Inglês</span><strong>' + escapeHtml(englishLevel.level) + '</strong><small>' + escapeHtml(englishLevel.title) + '</small></div>' +
            '</div>' +
            '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
            '<div class="bar-label"><span>' + chaptersRead + ' de ' + total + ' capítulos</span><span>' + pct + '% da Palavra</span></div>' +
          '</div>' +
        '</div>';

      const axisTabs =
        '<div class="axis-tabs">' +
          '<div class="axis-tab ' + (ctx.axis === 'bible' ? 'active' : '') + '" onclick="selectAxis(\'bible\')">📖 Bíblia</div>' +
          '<div class="axis-tab ' + (ctx.axis === 'english' ? 'active' : '') + '" onclick="selectAxis(\'english\')">🔤 Inglês</div>' +
        '</div>';

      const badges = (d.badges && d.badges.length)
        ? '<div class="badges">' + d.badges.map(b => '<div class="badge">🏅 ' + b.label + '</div>').join('') + '</div>'
        : '<div class="empty">Nenhuma insígnia ainda. Leia um capítulo para começar!</div>';

      const axis = axisDefinition(ctx.axis);
      const axisHeader =
        '<div class="axis-panel-head">' +
          '<div class="axis-panel-copy"><h2>' + (ctx.axis === 'bible' ? '📚 ' : '🔤 ') + escapeHtml(axis.name) + '</h2><p>' + escapeHtml(axis.description) + '</p></div>' +
          '<button class="placement-button" type="button" onclick="openPlacement(\'' + ctx.axis + '\')">Fazer teste de nivelamento</button>' +
        '</div>';

      let body;
      if (ctx.axis === 'english') {
        body = axisHeader + '<div class="english-box">Lições bilíngues a partir dos capítulos que você lê. Faça o teste de nivelamento para registrar seu ponto de partida e receber um nível de inglês para a jornada.</div>';
      } else {
        body = axisHeader +
          '<div class="section-title">Trilha Principal</div>' +
          '<div class="picker-label">Seção</div>' +
          '<div class="picker">' + ctx.tracks.bible.sections.map(s =>
            '<span class="pill ' + (s.id === ctx.section ? 'active' : '') + '" onclick="selectSection(\'' + s.id + '\')">' + escapeHtml(s.name) + '</span>'
          ).join('') + '</div>' +
          '<div class="picker-label">Livro</div>' +
          '<div class="picker">' + currentSection().books.map(b =>
            '<span class="pill book-pill ' + (b.usfm === ctx.book ? 'active' : '') + '" onclick="selectBook(\'' + b.usfm + '\')"><span>' + escapeHtml(b.name) + '</span><small>' + b.chapters + ' cap.</small></span>'
          ).join('') + '</div>' +
          '<div class="path" id="path"></div>' +
          renderThematic();
      }

      app.innerHTML = disciple + axisTabs + body +
        '<div class="section-title">🏅 Insígnias</div>' + badges;

      if (ctx.axis === 'bible') renderPath(d);
    }

    function renderThematic() {
      const themes = (ctx.tracks && ctx.tracks.thematic) || [];
      if (!themes.length) return '';
      return '<div class="section-title">✨ Trilhas Temáticas</div>' +
        themes.map(t =>
          '<div class="theme-card"><h4>' + t.name + '</h4><p>' + t.description + '</p>' +
          '<div class="theme-refs">' + t.references.map(r =>
            '<span class="ref-chip" onclick="openRef(\'' + r + '\')">' + r.replace('.', ' ') + '</span>'
          ).join('') + '</div></div>'
        ).join('');
    }

    function renderPath(d) {
      const book = currentBook();
      const read = readCountFor(d, book.usfm);
      let html = '';
      for (let i = 1; i <= book.chapters; i++) {
        const done = i <= read;
        const locked = i > read + 1;
        const cls = done ? 'done' : (locked ? 'locked' : '');
        const check = done ? '<span class="check">✓</span>' : '';
        const onclick = locked ? '' : 'onclick="openChapter(\'' + book.usfm + '\',' + i + ')"';
        const inner = done ? '<img src="/icons/lamp.svg" alt="concluído" />' : i;
        html += '<div class="node-row"><div>' +
            '<button class="node ' + cls + '" ' + onclick + '>' + inner + check + '</button>' +
            '<div class="node-cap">Cap. ' + i + '</div>' +
          '</div></div>';
      }
      document.getElementById('path').innerHTML = html;
    }

    function selectAxis(axis) { ctx.axis = axis; renderApp(ctx.dashboard); }
    function placementResultFor(axis, score) {
      const index = Math.max(0, Math.min((PLACEMENT_LEVELS[axis] || []).length - 1, score));
      const definition = PLACEMENT_LEVELS[axis][index];
      return { level: definition.level, title: definition.title, description: definition.description, score };
    }

    function renderPlacementQuestion() {
      const placement = ctx.placement;
      const questions = PLACEMENT_QUESTIONS[placement.axis];
      const question = questions[placement.index];
      const axis = axisDefinition(placement.axis);
      document.getElementById('q-title').textContent = 'Teste de nivelamento · ' + axis.name;
      document.getElementById('q-ref').textContent = 'Descubra seu ponto de partida';
      document.getElementById('q-body').innerHTML =
        '<div class="placement-progress">Pergunta ' + (placement.index + 1) + ' de ' + questions.length + '</div>' +
        '<div class="placement-question">' + escapeHtml(question.question) + '</div>' +
        question.options.map((option, index) =>
          '<button class="placement-option ' + (placement.selected === index ? 'sel' : '') + '" type="button" data-placement-idx="' + index + '" onclick="selectPlacementOption(' + index + ')">' + escapeHtml(option) + '</button>'
        ).join('');
      document.getElementById('q-confirm').textContent = placement.index === questions.length - 1 ? 'Ver meu nível' : 'Próxima pergunta';
      document.getElementById('q-confirm').disabled = placement.selected === null;
      document.getElementById('q-skip').textContent = 'Cancelar teste';
    }

    function openPlacement(axis) {
      ctx.placement = { axis, index: 0, score: 0, selected: null, result: null };
      document.getElementById('overlay').classList.add('open');
      renderPlacementQuestion();
    }

    function selectPlacementOption(index) {
      if (!ctx.placement || ctx.placement.result) return;
      ctx.placement.selected = index;
      document.querySelectorAll('.placement-option').forEach(el => el.classList.toggle('sel', Number(el.dataset.placementIdx) === index));
      document.getElementById('q-confirm').disabled = false;
    }

    function advancePlacement() {
      const placement = ctx.placement;
      if (!placement || placement.selected === null) return;
      const questions = PLACEMENT_QUESTIONS[placement.axis];
      if (placement.selected === questions[placement.index].correctIndex) placement.score += 1;

      if (placement.index < questions.length - 1) {
        placement.index += 1;
        placement.selected = null;
        renderPlacementQuestion();
        return;
      }

      placement.result = placementResultFor(placement.axis, placement.score);
      savePlacementLevel(placement.axis, placement.result);
      const axis = axisDefinition(placement.axis);
      document.getElementById('q-title').textContent = 'Nivelamento concluído';
      document.getElementById('q-ref').textContent = axis.name;
      document.getElementById('q-body').innerHTML =
        '<div class="placement-result"><div class="muted">Seu nível de partida</div>' +
        '<div class="level-mark">' + escapeHtml(placement.result.level) + '</div>' +
        '<h3>' + escapeHtml(placement.result.title) + '</h3>' +
        '<p>' + escapeHtml(placement.result.description) + '</p>' +
        '<p class="muted">Você acertou ' + placement.result.score + ' de ' + questions.length + ' perguntas.</p></div>';
      document.getElementById('q-confirm').textContent = 'Fechar';
      document.getElementById('q-confirm').disabled = false;
      document.getElementById('q-skip').textContent = 'Refazer teste';
      renderApp(ctx.dashboard);
    }

    function confirmModal() {
      if (ctx.placement) {
        if (ctx.placement.result) closeModal();
        else advancePlacement();
        return;
      }
      completeChapter(true);
    }

    function skipModal() {
      if (ctx.placement) {
        if (ctx.placement.result) openPlacement(ctx.placement.axis);
        else closeModal();
        return;
      }
      completeChapter(false);
    }

    function selectSection(id) {
      ctx.section = id;
      ctx.book = currentSection().books[0].usfm;
      renderApp(ctx.dashboard);
    }
    function selectBook(usfm) { ctx.book = usfm; renderApp(ctx.dashboard); }

    // Abre lição por referência USFM completa (ex.: 'PRO.3') vinda das temáticas.
    function openRef(ref) {
      const [usfm, ch] = ref.split('.');
      openChapter(usfm, Number(ch));
    }

    async function openChapter(usfm, chapter) {
      const ref = usfm + '.' + chapter;
      ctx.current = { usfm, chapter, ref, selected: null, quiz: null };

      ctx.placement = null;
      document.getElementById('q-title').textContent = 'Lição: ' + ref.replace('.', ' ');
      document.getElementById('q-ref').textContent = 'Leitura + Tutor de IA';
      document.getElementById('q-skip').textContent = 'Ler sem quiz';
      document.getElementById('q-body').innerHTML = '<p class="q">Carregando a Palavra e o Tutor...</p>';
      document.getElementById('q-confirm').disabled = true;
      document.getElementById('overlay').classList.add('open');

      const lang = 'pt';
      const [passage, summary, quiz] = await Promise.all([
        api('/api/bible/passage?ref=' + ref + '&language=' + lang).catch(() => null),
        api('/api/ai/chapter-summary?ref=' + ref + '&language=' + lang).catch(() => null),
        api('/api/ai/quiz?ref=' + ref + '&language=' + lang).catch(() => []),
      ]);

      ctx.current.quiz = (Array.isArray(quiz) && quiz.length) ? quiz[0] : null;

      const textBlock = passage
        ? '<div class="scripture"><div class="scripture-ref">' + (passage.reference || ref) + '</div><p>' + escapeHtml(passage.content || '') + '</p></div>'
        : '<div class="scripture"><p class="muted">Texto indisponível no momento.</p></div>';

      const aiBlock = summary
        ? '<div class="ai-card"><div class="ai-tag">🤖 Tutor IA (bilíngue)</div>' +
          '<p><strong>PT:</strong> ' + escapeHtml(summary.summaryPt || '') + '</p>' +
          '<p><strong>EN:</strong> ' + escapeHtml(summary.summaryEn || '') + '</p>' +
          (summary.application ? '<p class="apply">🙏 ' + escapeHtml(summary.application) + '</p>' : '') +
          '</div>'
        : '';

      let quizBlock = '';
      if (ctx.current.quiz) {
        const q = ctx.current.quiz;
        quizBlock = '<div class="quiz-card"><p class="q">' + escapeHtml(q.question) + '</p>' +
          q.options.map((o, idx) => '<button class="opt" data-idx="' + idx + '" onclick="selectOpt(' + idx + ')">' + escapeHtml(o) + '</button>').join('') +
          '</div>';
      }

      document.getElementById('q-body').innerHTML = textBlock + aiBlock + quizBlock;
      document.getElementById('q-confirm').disabled = ctx.current.quiz ? true : false;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function selectOpt(idx) {
      ctx.current.selected = idx;
      document.querySelectorAll('.opt').forEach(el => el.classList.toggle('sel', Number(el.dataset.idx) === idx));
      document.getElementById('q-confirm').disabled = false;
    }

    function closeModal() {
      document.getElementById('overlay').classList.remove('open');
      ctx.placement = null;
    }

    async function completeChapter(withQuiz) {
      const { usfm, chapter, selected, quiz } = ctx.current;
      const quizPassed = withQuiz && !!quiz && selected === quiz.answerIndex;
      try {
        const r = await api('/api/progress/complete-chapter', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: ctx.userId, challengeId: ctx.challengeId,
            bookUsfm: usfm, chapter, language: 'pt', quizPassed,
          }),
        });
        closeModal();
        let msg = '+' + r.xpAwarded + ' XP';
        if (r.bookCompleted) msg += ' · Livro concluído! 📗';
        if (r.badgesAwarded && r.badgesAwarded.length) msg += ' · ' + r.badgesAwarded.join(', ');
        toast(msg);
        await refresh();
      } catch (e) {
        if (e.data && e.data.error && e.data.error.code === 'CHAPTER_ALREADY_COMPLETED') {
          closeModal(); toast('Capítulo já concluído 🙏'); await refresh();
        } else {
          toast('Erro ao concluir. Tente de novo.');
        }
      }
    }

    document.getElementById('q-confirm').onclick = confirmModal;
    document.getElementById('q-skip').onclick = skipModal;
    document.getElementById('overlay').onclick = (e) => { if (e.target.id === 'overlay') closeModal(); };

    bootstrap().catch(err => {
      document.getElementById('app').innerHTML =
        '<div class="loading">Não foi possível iniciar. Verifique se o banco está configurado.<br><small>' +
        (err && err.data && err.data.error ? err.data.error.message : 'Erro desconhecido') + '</small></div>';
    });
  </script>
</body>
</html>
