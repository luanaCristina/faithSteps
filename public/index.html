<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FaithSteps - Discipulado Gamificado</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --bg: #0f1220; --panel: #161a2e; --panel2: #1d2238; --border: #2a2f45;
      --text: #e7e9f0; --muted: #9aa2c0; --purple: #7d5cff; --purple2: #a487ff;
      --green: #58cc02; --green-d: #46a302; --gold: #ffc800; --blue: #1cb0f6;
      --locked: #3a3f57;
      color-scheme: dark;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    /* Header de gamificacao */
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
      padding: 10px 18px; background: rgba(15,18,32,.95);
      backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 1.05rem; margin-right: auto; letter-spacing: .3px; }
    .brand img { width: 30px; height: 30px; display: block; }
    .brand span { color: var(--purple2); }
    .stat { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: .92rem; }
    .stat img { width: 22px; height: 22px; display: block; }
    .stat .ic { font-size: 1.05rem; }
    .stat.xp { color: var(--gold); }
    .stat.streak { color: #c9d2ec; }
    .stat.talents { color: var(--green); }
    .stat.bibles { color: var(--blue); }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .top-link { border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 10px; padding: 7px 10px; font-size: .78rem; font-weight: 750; cursor: pointer; transition: color .16s, border-color .16s, background .16s, transform .16s; }
    .top-link:hover { color: #fff; border-color: var(--purple); background: rgba(125,92,255,.14); }
    .top-link:active { transform: scale(.97); }
    .top-link.account { color: #fff; border-color: var(--purple); }

    main { max-width: 720px; margin: 0 auto; padding: 18px; }
    .auth-shell, .about-shell { background: linear-gradient(145deg, #19172e, #211b3b); border: 1px solid var(--border); border-radius: 18px; padding: 24px; box-shadow: 0 18px 42px rgba(0,0,0,.24); }
    .auth-shell { max-width: 470px; margin: 34px auto 0; }
    .about-shell { margin: 12px auto 0; }
    .auth-kicker, .about-kicker { color: var(--purple2); font-size: .78rem; font-weight: 850; letter-spacing: .08em; text-transform: uppercase; }
    .auth-shell h1, .about-shell h1 { font-size: 1.55rem; margin: 8px 0; }
    .auth-shell > p, .about-shell .lead { color: var(--muted); line-height: 1.55; font-size: .92rem; }
    .auth-form { display: grid; gap: 12px; margin-top: 20px; }
    .field { display: grid; gap: 6px; }
    .field label { color: #d9dded; font-size: .78rem; font-weight: 750; }
    .field input, .field select { width: 100%; background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 11px 12px; font: inherit; font-size: .9rem; outline: none; }
    .field input:focus, .field select:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(125,92,255,.18); }
    .auth-submit { margin-top: 4px; }
    .auth-switch { margin-top: 16px; text-align: center; color: var(--muted); font-size: .82rem; }
    .text-button { border: 0; background: transparent; color: var(--purple2); font: inherit; font-weight: 800; cursor: pointer; padding: 0; }
    .form-error { display: none; background: rgba(255,92,92,.1); border: 1px solid rgba(255,92,92,.4); color: #ffb7b7; border-radius: 10px; padding: 10px 12px; font-size: .82rem; line-height: 1.4; }
    .form-error.show { display: block; }
    .about-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 20px 0; }
    .about-card { background: rgba(15,18,32,.34); border: 1px solid rgba(255,255,255,.1); border-radius: 13px; padding: 15px; }
    .about-card h2 { font-size: .94rem; margin-bottom: 7px; }
    .about-card p, .about-shell li { color: var(--muted); line-height: 1.55; font-size: .84rem; }
    .about-shell ul { padding-left: 18px; display: grid; gap: 7px; }
    .about-cta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .about-cta .btn { width: auto; padding: 11px 16px; }
    .resume-note { display: inline-flex; align-items: center; gap: 6px; color: var(--green); font-size: .76rem; margin-top: 7px; }
    @media (max-width: 520px) {
      .topbar { padding: 10px 12px; gap: 8px; }
      .brand { margin-right: 0; }
      .top-actions { width: 100%; order: 3; }
      .top-link { flex: 1; }
      .about-grid { grid-template-columns: 1fr; }
      .auth-shell, .about-shell { padding: 19px; }
    }

    /* Cartao do Discipulo + mascote peixe */
    .disciple {
      display: flex; align-items: center; gap: 16px;
      background: linear-gradient(135deg, #241a4a, #3a1b4a);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 16px 18px; margin-bottom: 18px;
    }
    .disciple .mascot { width: 68px; height: 68px; flex: 0 0 auto; }
    .disciple .info { flex: 1; min-width: 0; }
    .disciple .era { font-size: 1.15rem; font-weight: 800; }
    .disciple .sub { color: var(--muted); font-size: .85rem; margin-top: 2px; }
    .bar { height: 12px; background: var(--panel2); border-radius: 8px; overflow: hidden; margin-top: 12px; }
    .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--green), var(--green-d)); border-radius: 8px; transition: width .5s; }
    .bar-label { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-top: 6px; }

    .section-title { font-size: 1rem; font-weight: 800; margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }

    /* Abas de eixo (Biblia / Ingles) */
    .axis-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .axis-tab { flex: 1; text-align: center; padding: 10px; border-radius: 12px; background: var(--panel); border: 1px solid var(--border); font-weight: 700; font-size: .9rem; color: var(--muted); cursor: pointer; }
    .axis-tab.active { background: var(--purple); color: #fff; border-color: var(--purple); }
    .axis-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 18px 0 12px; }
    .axis-panel-copy { min-width: 0; }
    .axis-panel-head h2 { font-size: 1rem; margin-bottom: 4px; }
    .axis-panel-head p { color: var(--muted); font-size: .82rem; line-height: 1.4; }
    .placement-button { flex: 0 0 auto; border: 1px solid var(--purple); color: #fff; background: rgba(125,92,255,.18); border-radius: 10px; padding: 9px 12px; font-size: .78rem; font-weight: 800; cursor: pointer; transition: transform .16s, background .16s; }
    .placement-button:hover { background: var(--purple); }
    .placement-button:active { transform: scale(.97); }
    .book-pill { gap: 5px; }
    .book-pill small { color: inherit; opacity: .78; font-size: .68rem; font-weight: 600; }

    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--border); font-size: .82rem; color: var(--muted); cursor: pointer; }
    .pill.active { background: var(--purple); color: #fff; border-color: var(--purple); }
    .picker { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .picker-label { font-size: .78rem; color: var(--muted); margin: 8px 0 4px; }

    /* Trilha estilo Duolingo */
    .path { position: relative; padding: 10px 0 30px; }
    .node-row { display: flex; justify-content: center; margin: 10px 0; }
    .node-row:nth-child(odd) { transform: translateX(-64px); }
    .node-row:nth-child(even) { transform: translateX(64px); }
    .node {
      width: 74px; height: 74px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.05rem; cursor: pointer; position: relative;
      border: none; color: #17371a; background: var(--green);
      box-shadow: 0 6px 0 var(--green-d); transition: transform .1s, box-shadow .1s;
    }
    .node:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--green-d); }
    .node.done { background: var(--gold); box-shadow: 0 6px 0 #c99a00; color: #3a2c00; }
    .node.done img { width: 34px; height: 34px; }
    .node.locked { background: var(--locked); box-shadow: 0 6px 0 #23273a; color: #6b7290; cursor: not-allowed; }
    .node .check { position: absolute; top: -6px; right: -6px; background: #fff; color: var(--green-d); border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: .8rem; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
    .node-cap { text-align: center; font-size: .72rem; color: var(--muted); margin-top: 4px; }

    /* Trilhas tematicas */
    .theme-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
    .theme-card h4 { font-size: .95rem; margin-bottom: 4px; }
    .theme-card p { color: var(--muted); font-size: .82rem; margin-bottom: 8px; }
    .theme-refs { display: flex; gap: 6px; flex-wrap: wrap; }
    .ref-chip { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; font-size: .78rem; cursor: pointer; }
    .ref-chip:hover { border-color: var(--purple); }

    /* Badges */
    .badges { display: flex; gap: 10px; flex-wrap: wrap; }
    .badge { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font-size: .82rem; display: flex; align-items: center; gap: 8px; }
    .empty { color: var(--muted); font-size: .85rem; }
    .audio-button { display: inline-flex; align-items: center; gap: 5px; border: 1px solid rgba(113,190,255,.35); border-radius: 8px; padding: 5px 8px; background: rgba(28,176,246,.12); color: #dce9ff; font-size: .74rem; font-weight: 800; cursor: pointer; }
    .audio-button:hover { border-color: var(--blue); background: rgba(28,176,246,.2); }
    .audio-button.speaking { border-color: var(--gold); color: var(--gold); }
    .verse-audio { display: flex; justify-content: flex-end; margin-top: 9px; }
    .achievement-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; margin-bottom: 14px; }
    .achievement-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 11px; display: flex; align-items: center; gap: 8px; }
    .achievement-card strong { display: block; font-size: .78rem; }
    .achievement-card small { display: block; color: var(--muted); font-size: .69rem; margin-top: 2px; }
    .achievement-icon { font-size: 1.2rem; }
    .achievement-card.locked { opacity: .5; }
    .ranking-shell { background: linear-gradient(135deg, rgba(125,92,255,.14), rgba(28,176,246,.08)); border: 1px solid rgba(125,92,255,.28); border-radius: 15px; padding: 15px; margin: 18px 0; }
    .ranking-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 9px; }
    .ranking-head h3 { font-size: 1rem; }
    .ranking-head span { color: var(--muted); font-size: .72rem; }
    .ranking-row { display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 8px; background: rgba(7,10,20,.28); border-radius: 9px; padding: 8px 9px; margin-top: 5px; font-size: .78rem; }
    .ranking-row.me { border: 1px solid rgba(67,217,154,.45); background: rgba(67,217,154,.08); }
    .ranking-position { color: var(--gold); font-weight: 900; text-align: center; }
    .ranking-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ranking-name small { display: block; color: var(--muted); font-size: .68rem; margin-top: 2px; }
    .ranking-score { color: #fff; font-weight: 850; text-align: right; }
    .ranking-current { border-top: 1px solid var(--border); margin-top: 10px; padding-top: 9px; color: var(--muted); font-size: .76rem; }
    .ranking-current strong { color: var(--green); }
    @media (max-width: 520px) {
      .achievement-grid { grid-template-columns: 1fr; }
    }

    /* Jornada de Inglês com a Bíblia */
    .english-box { background: var(--panel); border: 1px dashed var(--border); border-radius: 14px; padding: 22px; text-align: center; color: var(--muted); }
    .english-journey-summary { background: linear-gradient(135deg, rgba(28,176,246,.12), rgba(125,92,255,.15)); border: 1px solid rgba(113,190,255,.25); border-radius: 15px; padding: 16px; margin-bottom: 18px; }
    .english-journey-summary h3 { font-size: 1rem; margin-bottom: 5px; }
    .english-journey-summary p { color: var(--muted); font-size: .82rem; line-height: 1.5; margin-bottom: 12px; }
    .english-summary-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: .78rem; color: var(--muted); }
    .english-summary-row strong { color: #fff; font-size: .9rem; }
    .english-progress-track { height: 8px; border-radius: 99px; background: rgba(7,10,20,.5); overflow: hidden; margin-top: 8px; }
    .english-progress-track i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--purple2)); transition: width .25s ease; }
    .english-module { margin-bottom: 20px; }
    .english-module-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
    .english-module-head h3 { font-size: 1rem; margin-bottom: 4px; }
    .english-module-head p { color: var(--muted); font-size: .8rem; line-height: 1.45; }
    .module-level, .lesson-level { color: var(--blue); font-size: .72rem; font-weight: 850; letter-spacing: .04em; white-space: nowrap; }
    .english-lessons { display: grid; gap: 9px; }
    .english-lesson { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 11px; background: var(--panel); border: 1px solid var(--border); border-radius: 13px; padding: 12px 13px; cursor: pointer; transition: transform .16s, border-color .16s, background .16s; }
    .english-lesson:hover { transform: translateY(-1px); border-color: var(--purple); background: #211e3a; }
    .english-lesson.done { border-color: rgba(67,217,154,.42); }
    .english-lesson.locked { opacity: .48; cursor: not-allowed; }
    .english-lesson.locked:hover { transform: none; border-color: var(--border); background: var(--panel); }
    .lesson-index { display: grid; place-items: center; width: 29px; height: 29px; border-radius: 50%; background: var(--panel2); color: var(--muted); font-weight: 850; font-size: .78rem; }
    .english-lesson.done .lesson-index { background: var(--green); color: #10261d; }
    .english-lesson h4 { font-size: .9rem; margin: 2px 0 4px; }
    .english-lesson p { color: var(--muted); font-size: .77rem; line-height: 1.4; }
    .lesson-meta { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 7px; color: var(--muted); font-size: .7rem; }
    .lesson-meta span { background: rgba(15,18,32,.34); border-radius: 7px; padding: 4px 6px; }
    .lesson-status { color: var(--green); font-size: .72rem; font-weight: 800; text-align: right; }
    .lesson-status.lock { color: var(--muted); font-size: 1rem; }
    .english-lesson-modal .modal-verse { background: linear-gradient(135deg, #17233b, #241b43); border: 1px solid rgba(113,190,255,.22); border-radius: 12px; padding: 14px; margin-bottom: 12px; line-height: 1.55; font-size: .92rem; font-style: italic; }
    .english-lesson-modal .modal-verse small { display: block; color: var(--blue); font-size: .75rem; font-style: normal; font-weight: 800; margin-top: 8px; }
    .lesson-focus { background: var(--panel2); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; color: var(--muted); font-size: .82rem; }
    .lesson-focus strong { color: var(--gold); }
    .vocabulary { display: flex; flex-wrap: wrap; gap: 6px; margin: 7px 0 14px; }
    .vocabulary span { border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; color: #dce9ff; font-size: .76rem; }
    .vocabulary-word { display: inline-flex; align-items: center; gap: 5px; }
    .vocabulary-word .audio-button { border: 0; background: transparent; padding: 1px 2px; font-size: .7rem; }
    .lesson-practice { border-left: 3px solid var(--purple); padding: 3px 0 3px 11px; color: var(--muted); font-size: .84rem; line-height: 1.45; }
    @media (max-width: 520px) {
      .english-module-head { flex-direction: column; gap: 4px; }
      .english-lesson { grid-template-columns: 30px 1fr; }
      .lesson-status { grid-column: 2; text-align: left; }
    }

    /* Modal licao */
    .overlay { position: fixed; inset: 0; background: rgba(5,7,15,.7); display: none; align-items: center; justify-content: center; padding: 18px; z-index: 50; }
    .overlay.open { display: flex; }
    .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 22px; width: 100%; max-width: 440px; max-height: 90vh; overflow: auto; }
    .modal h3 { font-size: 1.15rem; margin-bottom: 6px; }
    .modal .ref { color: var(--purple2); font-weight: 700; margin-bottom: 14px; }
    .modal p.q { font-size: .95rem; margin-bottom: 12px; }
    .modal .scripture { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; max-height: 200px; overflow: auto; font-size: .9rem; line-height: 1.55; }
    .modal .scripture-ref { color: var(--purple2); font-weight: 700; font-size: .8rem; margin-bottom: 6px; }
    .modal .ai-card { background: linear-gradient(135deg, #1a2540, #241a4a); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: .85rem; }
    .modal .ai-card .ai-tag { color: var(--blue); font-weight: 800; font-size: .78rem; margin-bottom: 6px; }
    .modal .ai-card p { margin-bottom: 6px; }
    .modal .ai-card .apply { color: var(--gold); }
    .modal .quiz-card { margin-top: 4px; }
    .placement-progress { color: var(--muted); font-size: .78rem; margin-bottom: 12px; }
    .placement-question { font-size: 1rem; font-weight: 750; line-height: 1.45; margin-bottom: 14px; }
    .placement-option { display: block; width: 100%; text-align: left; background: var(--panel2); border: 2px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; font-size: .9rem; transition: border-color .16s, background .16s, transform .16s; }
    .placement-option:hover { border-color: var(--purple); }
    .placement-option:active { transform: scale(.99); }
    .placement-option.sel { border-color: var(--blue); background: rgba(28,176,246,.12); }
    .placement-result { text-align: center; padding: 8px 0 4px; }
    .placement-result .level-mark { color: var(--gold); font-size: 2rem; font-weight: 900; margin: 6px 0 8px; }
    .placement-result p { color: var(--muted); line-height: 1.5; font-size: .9rem; }
    .axis-levels { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 12px 0 2px; }
    .axis-level { background: rgba(15,18,32,.28); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 8px 10px; min-width: 0; }
    .axis-level span { display: block; color: var(--muted); font-size: .72rem; margin-bottom: 3px; }
    .axis-level strong { display: block; color: #fff; font-size: .84rem; }
    .axis-level small { display: block; color: var(--muted); font-size: .7rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @media (max-width: 520px) {
      .axis-panel-head { flex-direction: column; }
      .placement-button { width: 100%; }
      .axis-levels { grid-template-columns: 1fr; }
    }
    .muted { color: var(--muted); }
    .opt { display: block; width: 100%; text-align: left; background: var(--panel2); border: 2px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; cursor: pointer; font-size: .9rem; }
    .opt:hover { border-color: var(--purple); }
    .opt.sel { border-color: var(--blue); }
    .btn { width: 100%; background: var(--green); color: #123; font-weight: 800; border: none; border-radius: 14px; padding: 14px; font-size: 1rem; cursor: pointer; box-shadow: 0 5px 0 var(--green-d); }
    .btn:disabled { background: var(--locked); box-shadow: 0 5px 0 #23273a; color: #6b7290; cursor: not-allowed; }
    .btn.secondary { background: var(--panel2); color: var(--text); box-shadow: 0 5px 0 #12152a; margin-top: 8px; }

    .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(20px); background: var(--green); color: #123; font-weight: 800; padding: 14px 20px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.4); opacity: 0; transition: all .3s; z-index: 60; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .loading { text-align: center; color: var(--muted); padding: 40px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="/icons/lamp.svg" alt="" />Faith<span>Steps</span></div>
    <div class="stat streak" title="Ofensiva (constância na Palavra)"><img src="/icons/tablets.svg" alt="ofensiva" /><span id="t-streak">0</span></div>
    <div class="stat xp" title="Experiência"><img src="/icons/lamp.svg" alt="XP" /><span id="t-xp">0</span></div>
    <div class="stat talents" title="Talentos">🪙<span id="t-talents">0</span></div>
    <div class="stat bibles" title="Bíblias doadas">📖<span id="t-bibles">0</span></div>
    <div id="account-actions" class="top-actions">
      <button class="top-link" type="button" onclick="showAbout()">Sobre</button>
      <button class="top-link account" type="button" onclick="showAuth('login')">Entrar</button>
    </div>
  </div>

  <main>
    <div id="app"><div class="loading">Preparando sua jornada...</div></div>
  </main>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h3 id="q-title">Capítulo</h3>
      <div class="ref" id="q-ref"></div>
      <div id="q-body"></div>
      <button class="btn" id="q-confirm" disabled>Concluir capítulo</button>
      <button class="btn secondary" id="q-skip">Ler sem quiz</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = '';
    let ctx = {
      userId: null, challengeId: null, dashboard: null, tracks: null,
      axis: 'bible', section: null, book: null, current: null,
      placementLevels: {}, placement: null, view: 'auth', authMode: 'login', authUser: null,
      englishCompleted: {}, englishLesson: null, ranking: null,
    };

    const PLACEMENT_QUESTIONS = {
      bible: [
        { question: 'Quantos livros compõem a Bíblia na tradição cristã protestante?', options: ['39', '66', '73', '1.189'], correctIndex: 1 },
        { question: 'Qual conjunto reúne os quatro Evangelhos?', options: ['Mateus, Marcos, Lucas e João', 'Romanos, Gálatas, Efésios e Filipenses', 'Gênesis, Êxodo, Levítico e Números', 'Salmos, Provérbios, Jó e Eclesiastes'], correctIndex: 0 },
        { question: 'Ao estudar um capítulo, qual prática ajuda a respeitar melhor seu contexto?', options: ['Ler apenas uma frase isolada', 'Ignorar quem escreveu e para quem foi escrito', 'Observar o contexto literário, histórico e a intenção do texto', 'Escolher a interpretação mais popular'], correctIndex: 2 },
        { question: 'Qual livro é conhecido por reunir muitos cânticos e orações?', options: ['Salmos', 'Atos', 'Apocalipse', 'Neemias'], correctIndex: 0 },
        { question: 'Uma leitura bíblica madura busca principalmente:', options: ['Vencer debates', 'Aplicar o texto com fidelidade, amor e discernimento', 'Memorizar números sem compreender', 'Substituir a comunidade por opiniões individuais'], correctIndex: 1 },
      ],
      english: [
        { question: 'In the Bible, the word “grace” is closest in meaning to:', options: ['Free and undeserved kindness', 'A difficult battle', 'A place to live', 'A musical instrument'], correctIndex: 0 },
        { question: 'Choose the sentence that means “Jesus ama seus discípulos”.', options: ['Jesus loved his disciples.', 'Jesus is loving his disciples yesterday.', 'Jesus love his disciples.', 'Jesus will loved his disciples.'], correctIndex: 0 },
        { question: 'What does “I have read the chapter” communicate?', options: ['I am going to read it tomorrow.', 'I finished reading it at some point before now.', 'I never opened the chapter.', 'I am writing the chapter.'], correctIndex: 1 },
        { question: 'In “Although the passage is difficult, I can understand it”, “although” introduces:', options: ['A contrast', 'A location', 'A quantity', 'A greeting'], correctIndex: 0 },
        { question: 'In a theological context, “sanctification” refers to:', options: ['The process of being made holy', 'The act of changing a book cover', 'A type of travel', 'The beginning of a meal'], correctIndex: 0 },
      ],
    };

    const PLACEMENT_LEVELS = {
      bible: [
        { level: 1, title: 'Aprendiz da Palavra', description: 'Fundamentos para cultivar o hábito de leitura e conhecer a narrativa bíblica.' },
        { level: 2, title: 'Discípulo Caminhante', description: 'Boa base para avançar pelos Evangelhos e aplicar a Palavra no cotidiano.' },
        { level: 3, title: 'Guardião da Palavra', description: 'Leitura consistente com atenção a contexto, prática e memorização.' },
        { level: 4, title: 'Mestre & Discipulador', description: 'Maturidade para estudar, interpretar e compartilhar a Palavra com outros.' },
        { level: 5, title: 'Expert & Exegeta', description: 'Visão ampla das Escrituras e discernimento para estudos mais profundos.' },
      ],
      english: [
        { level: 'A1/A2', title: 'Inglês essencial', description: 'Vocabulário fundamental e frases simples para começar a ler a Bíblia em inglês.' },
        { level: 'B1', title: 'Inglês intermediário', description: 'Compreensão de textos familiares e comunicação em situações do dia a dia.' },
        { level: 'B2', title: 'Inglês independente', description: 'Boa compreensão de textos teológicos intermediários e maior autonomia.' },
        { level: 'C1', title: 'Inglês avançado', description: 'Leitura fluente, análise de contexto e comunicação precisa em temas complexos.' },
        { level: 'C2', title: 'Inglês proficiente', description: 'Domínio avançado para interpretar e ensinar conteúdos bíblicos em inglês.' },
      ],
    };

    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg; el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2600);
    }

    async function api(path, opts) {
      const res = await fetch(API + path, { credentials: 'include', ...(opts || {}) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Object({ status: res.status, data });
      return data;
    }

    function readPlacementLevels(userId) {
      try {
        return JSON.parse(localStorage.getItem('fs_placement_' + userId) || '{}') || {};
      } catch (_) {
        return {};
      }
    }

    function savePlacementLevel(axis, result) {
      ctx.placementLevels[axis] = result;
      try {
        localStorage.setItem('fs_placement_' + ctx.userId, JSON.stringify(ctx.placementLevels));
      } catch (_) {
        // A jornada continua funcionando mesmo quando o armazenamento local está indisponível.
      }
    }

    function axisDefinition(axis) {
      const fallback = {
        bible: { name: 'Bíblia', description: 'Leitura e estudo da Palavra, dos 66 livros às trilhas temáticas.' },
        english: { name: 'Inglês', description: 'Aprendizado bilíngue de inglês usando a Bíblia como base.' },
      };
      return ((ctx.tracks && ctx.tracks.axes) || []).find(a => a.id === axis) || fallback[axis];
    }

    function placementLevelFor(axis, d) {
      const saved = ctx.placementLevels[axis];
      if (saved && saved.level) return saved;
      const level = axis === 'bible' ? d.discipleship.level : d.discipleship.englishLevel;
      const definition = (PLACEMENT_LEVELS[axis] || []).find(item => item.level === level);
      return { level, title: definition ? definition.title : 'Ainda não avaliado' };
    }

    function setBookContext(usfm) {
      if (!ctx.tracks || !ctx.tracks.bible) return;
      const section = ctx.tracks.bible.sections.find(s => s.books.some(book => book.usfm === usfm));
      if (section) {
        ctx.section = section.id;
        ctx.book = usfm;
      }
    }

    function restoreLastPosition(d) {
      if (d.progress && d.progress.lastBookUsfm) setBookContext(d.progress.lastBookUsfm);
    }

    // A jornada só é carregada depois que a sessão do usuário é confirmada.
    async function bootstrap() {
      try {
        const session = await api('/api/auth/me');
        ctx.authUser = session.user;
        ctx.userId = session.user.id;
        ctx.challengeId = session.challenge.id;
        ctx.tracks = await api('/api/tracks');
        if (ctx.tracks && ctx.tracks.bible.sections.length) {
          ctx.section = ctx.tracks.bible.sections[0].id;
          ctx.book = ctx.tracks.bible.sections[0].books[0].usfm;
        }
        ctx.placementLevels = readPlacementLevels(ctx.userId);
        ctx.view = 'dashboard';
        await refresh();
      } catch (err) {
        if (err && err.status === 401) {
          renderTop(null);
          showAuth('login');
        } else {
          document.getElementById('app').innerHTML = '<div class="loading">Não foi possível carregar a sua conta. Tente novamente.</div>';
        }
      }
    }

    async function refresh() {
      const [d, ranking] = await Promise.all([
        api('/api/users/' + ctx.userId + '/dashboard'),
        api('/api/leaderboard').catch(() => null),
      ]);
      ctx.dashboard = d;
      ctx.ranking = ranking;
      ctx.englishCompleted = {};
      (d.englishProgress && d.englishProgress.completedLessonIds || []).forEach(id => { ctx.englishCompleted[id] = true; });
      restoreLastPosition(d);
      renderTop(d);
      renderApp(d);
    }

    function renderTop(d) {
      document.getElementById('t-streak').textContent = d ? d.user.currentStreak : '0';
      document.getElementById('t-xp').textContent = d ? d.user.totalXp : '0';
      document.getElementById('t-talents').textContent = d ? d.talents.balance : '0';
      document.getElementById('t-bibles').textContent = d ? d.talents.biblesDonated : '0';
      const actions = document.getElementById('account-actions');
      actions.innerHTML = '<button class="top-link" type="button" onclick="showAbout()">Sobre</button>' +
        (ctx.userId
          ? '<button class="top-link account" type="button" onclick="logout()">Sair</button>'
          : '<button class="top-link account" type="button" onclick="showAuth(\'login\')">Entrar</button>');
    }

    function readCountFor(d, usfm) {
      const b = (d.progress && d.progress.books || []).find(x => x.usfm === usfm);
      return b ? b.chaptersRead : 0;
    }

    function currentSection() {
      return ctx.tracks.bible.sections.find(s => s.id === ctx.section) || ctx.tracks.bible.sections[0];
    }
    function currentBook() {
      const sec = currentSection();
      return sec.books.find(b => b.usfm === ctx.book) || sec.books[0];
    }

    async function saveLastPosition(usfm, chapter) {
      if (!ctx.userId || !ctx.challengeId) return;
      await api('/api/progress/position', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ challengeId: ctx.challengeId, bookUsfm: usfm, chapter }),
      }).catch(() => null);
    }

    function showAuth(mode) {
      ctx.view = 'auth';
      ctx.authMode = mode === 'register' ? 'register' : 'login';
      renderAuth();
    }

    function renderAuth() {
      const isRegister = ctx.authMode === 'register';
      const app = document.getElementById('app');
      app.innerHTML =
        '<section class="auth-shell" aria-labelledby="auth-title">' +
          '<div class="auth-kicker">FaithSteps</div>' +
          '<h1 id="auth-title">' + (isRegister ? 'Comece sua jornada' : 'Bem-vindo de volta') + '</h1>' +
          '<p>' + (isRegister ? 'Crie sua conta para guardar sua evolução, seus capítulos concluídos e o ponto exato onde parou.' : 'Entre para continuar sua jornada de discipulado do ponto em que parou.') + '</p>' +
          '<form class="auth-form" id="auth-form" onsubmit="submitAuth(event)">' +
            (isRegister ? '<div class="field"><label for="auth-name">Como devemos chamar você?</label><input id="auth-name" name="displayName" type="text" minlength="2" maxlength="120" autocomplete="name" required placeholder="Seu nome" /></div>' : '') +
            '<div class="field"><label for="auth-email">E-mail</label><input id="auth-email" name="email" type="email" maxlength="255" autocomplete="email" required placeholder="voce@exemplo.com" /></div>' +
            '<div class="field"><label for="auth-password">Senha</label><input id="auth-password" name="password" type="password" minlength="' + (isRegister ? '8' : '1') + '" maxlength="128" autocomplete="' + (isRegister ? 'new-password' : 'current-password') + '" required placeholder="' + (isRegister ? 'Pelo menos 8 caracteres' : 'Sua senha') + '" /></div>' +
            (isRegister ? '<div class="field"><label for="auth-language">Idioma preferido</label><select id="auth-language" name="preferredLanguage"><option value="pt">Português</option><option value="en">English</option></select></div>' : '') +
            '<div class="form-error" id="auth-error" role="alert"></div>' +
            '<button class="btn auth-submit" id="auth-submit" type="submit">' + (isRegister ? 'Criar minha conta' : 'Entrar na jornada') + '</button>' +
          '</form>' +
          '<div class="auth-switch">' + (isRegister ? 'Já possui uma conta? ' : 'Ainda não possui uma conta? ') + '<button class="text-button" type="button" onclick="showAuth(\'' + (isRegister ? 'login' : 'register') + '\')">' + (isRegister ? 'Entrar' : 'Criar cadastro') + '</button></div>' +
        '</section>';
    }

    function authErrorMessage(err) {
      if (err && err.data && err.data.error && err.data.error.message) return err.data.error.message;
      return 'Não foi possível concluir. Verifique os dados e tente novamente.';
    }

    async function submitAuth(event) {
      event.preventDefault();
      const form = event.target;
      const isRegister = ctx.authMode === 'register';
      const payload = {
        email: form.email.value.trim(),
        password: form.password.value,
      };
      if (isRegister) {
        payload.displayName = form.displayName.value.trim();
        payload.preferredLanguage = form.preferredLanguage.value;
      }
      const submit = document.getElementById('auth-submit');
      const error = document.getElementById('auth-error');
      submit.disabled = true;
      submit.textContent = isRegister ? 'Criando conta...' : 'Entrando...';
      error.classList.remove('show');
      try {
        const session = await api('/api/auth/' + (isRegister ? 'register' : 'login'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        ctx.authUser = session.user;
        ctx.userId = session.user.id;
        ctx.challengeId = session.challenge.id;
        ctx.tracks = await api('/api/tracks');
        if (ctx.tracks && ctx.tracks.bible.sections.length) {
          ctx.section = ctx.tracks.bible.sections[0].id;
          ctx.book = ctx.tracks.bible.sections[0].books[0].usfm;
        }
        ctx.placementLevels = readPlacementLevels(ctx.userId);
        ctx.view = 'dashboard';
        await refresh();
        toast(isRegister ? 'Conta criada. Sua jornada começa agora.' : 'Login realizado. Bom reencontro com a Palavra.');
      } catch (err) {
        error.textContent = authErrorMessage(err);
        error.classList.add('show');
        submit.disabled = false;
        submit.textContent = isRegister ? 'Criar minha conta' : 'Entrar na jornada';
      }
    }

    function renderAbout() {
      const app = document.getElementById('app');
      app.innerHTML =
        '<section class="about-shell" aria-labelledby="about-title">' +
          '<div class="about-kicker">Sobre o FaithSteps</div>' +
          '<h1 id="about-title">Uma jornada de discipulado que transforma constância em impacto.</h1>' +
          '<p class="lead">O FaithSteps foi criado para ajudar pessoas a lerem a Bíblia inteira, aprenderem inglês com as Escrituras e crescerem no caráter de Cristo. A experiência combina leitura, reflexão, acompanhamento e gamificação redentiva — sem culpa e sem penalidades.</p>' +
          '<div class="about-grid">' +
            '<article class="about-card"><h2>Leia no seu ritmo</h2><p>Escolha um dos 66 livros, avance capítulo a capítulo e registre suas conclusões. O progresso fica associado à sua conta.</p></article>' +
            '<article class="about-card"><h2>Aprenda em dois eixos</h2><p>O eixo Bíblia acompanha sua leitura e estudo. O eixo Inglês usa a Bíblia como base para desenvolver vocabulário e compreensão.</p></article>' +
            '<article class="about-card"><h2>Entenda sua evolução</h2><p>XP, ofensiva, níveis de discipulado, insígnias e Talentos tornam visível o caminho já percorrido e celebram a constância.</p></article>' +
            '<article class="about-card"><h2>Retome de onde parou</h2><p>Cada capítulo aberto é salvo na sua conta. Ao entrar novamente, a aplicação retorna ao livro e ao capítulo registrados na última sessão.</p></article>' +
          '</div>' +
          '<h2>Como funciona</h2>' +
          '<ul><li>Crie seu cadastro ou entre com seu e-mail e senha.</li><li>Escolha uma seção e um livro da Bíblia para começar.</li><li>Abra um capítulo, leia o conteúdo e conclua a lição quando terminar.</li><li>Use o teste de nivelamento de cada eixo para registrar seu ponto de partida.</li><li>Acompanhe XP, Talentos, insígnias e o progresso da Bíblia toda no cartão do Discípulo.</li></ul>' +
          '<div class="about-cta">' +
            (ctx.userId ? '<button class="btn" type="button" onclick="showDashboard()">Voltar à minha jornada</button>' : '<button class="btn" type="button" onclick="showAuth(\'register\')">Criar minha conta</button><button class="btn secondary" type="button" onclick="showAuth(\'login\')">Já tenho cadastro</button>') +
          '</div>' +
        '</section>';
    }

    function showAbout() {
      ctx.view = 'about';
      renderAbout();
    }

    function showDashboard() {
      if (!ctx.userId || !ctx.dashboard) {
        showAuth('login');
        return;
      }
      ctx.view = 'dashboard';
      renderApp(ctx.dashboard);
    }

    async function logout() {
      try {
        await api('/api/auth/logout', { method: 'POST' });
      } catch (_) {
        // Mesmo que a rede falhe, a sessão local é removida da interface.
      }
      ctx.userId = null;
      ctx.challengeId = null;
      ctx.dashboard = null;
      ctx.authUser = null;
      ctx.tracks = null;
      ctx.placementLevels = {};
      ctx.englishCompleted = {};
      ctx.englishLesson = null;
      ctx.ranking = null;
      ctx.view = 'auth';
      renderTop(null);
      showAuth('login');
      toast('Sessão encerrada.');
    }

    function findLessonInJourney(lessonId) {
      const modules = (ctx.tracks && ctx.tracks.english && ctx.tracks.english.modules) || [];
      for (const module of modules) {
        const lesson = module.lessons.find(item => item.id === lessonId);
        if (lesson) return lesson;
      }
      return null;
    }

    function openEnglishLesson(lessonId) {
      const lesson = findLessonInJourney(lessonId);
      if (!lesson || (ctx.englishCompleted[lessonId] === false)) return;
      ctx.englishLesson = lesson;
      ctx.placement = null;
      ctx.current = null;
      document.getElementById('overlay').classList.add('open');
      renderEnglishLessonModal();
    }

    function renderEnglishLessonModal() {
      const lesson = ctx.englishLesson;
      if (!lesson) return;
      const completed = !!ctx.englishCompleted[lesson.id];
      document.getElementById('q-title').textContent = 'Lição ' + lesson.id.replace('eng-', '') + ' · ' + lesson.title;
      document.getElementById('q-ref').textContent = 'Jornada de Inglês com a Bíblia';
      document.getElementById('q-body').innerHTML =
        '<div class="english-lesson-modal">' +
          '<p class="q">' + escapeHtml(lesson.description) + '</p>' +
          '<div class="modal-verse">“' + escapeHtml(lesson.verse) + '<small>📖 ' + escapeHtml(lesson.reference.replace('.', ' ')) + '</small><div class="verse-audio"><button class="audio-button" type="button" data-speak="' + escapeHtml(lesson.verse) + '">🔊 Ouvir versículo</button></div></div>' +
          '<div class="lesson-focus"><strong>Foco da aula:</strong> ' + escapeHtml(lesson.focus) + '</div>' +
          '<div class="muted">Vocabulário-chave · toque em uma palavra para ouvir</div>' +
          '<div class="vocabulary">' + lesson.vocabulary.map(word => '<span class="vocabulary-word">' + escapeHtml(word) + '<button class="audio-button" type="button" data-speak="' + escapeHtml(word) + '" aria-label="Ouvir ' + escapeHtml(word) + '">🔊</button></span>').join('') + '</div>' +
          '<div class="lesson-practice"><strong>Prática:</strong> ' + escapeHtml(lesson.practice) + '</div>' +
        '</div>';
      document.getElementById('q-confirm').textContent = completed ? 'Lição concluída' : 'Concluir lição';
      document.getElementById('q-confirm').disabled = completed;
      document.getElementById('q-skip').textContent = 'Fechar';
      document.querySelectorAll('[data-speak]').forEach(button => {
        button.addEventListener('click', () => speakEnglishText(button.dataset.speak, button));
      });
    }

    function speakEnglishText(text, button) {
      if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
        toast('Seu navegador não oferece áudio de pronúncia.');
        return;
      }
      window.speechSynthesis.cancel();
      document.querySelectorAll('.audio-button.speaking').forEach(el => el.classList.remove('speaking'));
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.84;
      utterance.pitch = 1;
      if (button) button.classList.add('speaking');
      utterance.onend = () => { if (button) button.classList.remove('speaking'); };
      utterance.onerror = () => { if (button) button.classList.remove('speaking'); };
      window.speechSynthesis.speak(utterance);
    }

    async function completeEnglishLesson() {
      const lesson = ctx.englishLesson;
      if (!lesson || ctx.englishCompleted[lesson.id]) {
        closeModal();
        return;
      }
      const confirm = document.getElementById('q-confirm');
      confirm.disabled = true;
      confirm.textContent = 'Salvando...';
      try {
        const response = await api('/api/english/lessons/' + lesson.id + '/complete', { method: 'POST' });
        ctx.englishCompleted[lesson.id] = true;
        closeModal();
        let message = response.newlyCompleted ? 'Lição concluída. Continue caminhando!' : 'Lição revisada.';
        if (response.awards && response.awards.length) message += ' · ' + response.awards.join(', ');
        toast(message);
        await refresh();
      } catch (_) {
        confirm.disabled = false;
        confirm.textContent = 'Concluir lição';
        toast('Não foi possível salvar a lição. Tente novamente.');
      }
    }

    function renderEnglishJourney(d) {
      const journey = ctx.tracks && ctx.tracks.english;
      const modules = (journey && journey.modules) || [];
      if (!modules.length) return '<div class="english-box">A jornada de Inglês estará disponível em breve.</div>';

      const totalLessons = journey.totalLessons || modules.reduce((total, module) => total + module.lessons.length, 0);
      const completedCount = d.englishProgress ? d.englishProgress.completedCount : Object.keys(ctx.englishCompleted).length;
      const percent = d.englishProgress ? d.englishProgress.percentComplete : Math.round((completedCount / totalLessons) * 100);
      const level = placementLevelFor('english', d);
      let nextLesson = null;
      modules.some(module => module.lessons.some(lesson => {
        if (!ctx.englishCompleted[lesson.id]) { nextLesson = lesson; return true; }
        return false;
      }));

      let journeyIndex = 0;
      let journeyUnlocked = true;
      const moduleHtml = modules.map(module => {
        const moduleCompleted = module.lessons.filter(lesson => ctx.englishCompleted[lesson.id]).length;
        const lessonsHtml = module.lessons.map(lesson => {
          journeyIndex += 1;
          const done = !!ctx.englishCompleted[lesson.id];
          const locked = !done && !journeyUnlocked;
          const status = done ? '✓ Concluída' : (locked ? '🔒 Bloqueada' : 'Começar');
          const handler = locked ? '' : `onclick="openEnglishLesson('${lesson.id}')"`;
          if (!done) journeyUnlocked = false;
          else journeyUnlocked = true;
          return '<div class="english-lesson ' + (done ? 'done ' : '') + (locked ? 'locked' : '') + '" role="button" tabindex="' + (locked ? '-1' : '0') + '" ' + handler + '>' +
            '<div class="lesson-index">' + (done ? '✓' : journeyIndex) + '</div>' +
            '<div><span class="lesson-level">' + escapeHtml(lesson.level) + '</span><h4>' + escapeHtml(lesson.title) + '</h4><p>' + escapeHtml(lesson.description) + '</p>' +
            '<div class="lesson-meta"><span>📖 ' + escapeHtml(lesson.reference.replace('.', ' ')) + '</span><span>Foco: ' + escapeHtml(lesson.focus) + '</span></div></div>' +
            '<div class="lesson-status ' + (locked ? 'lock' : '') + '">' + status + '</div>' +
          '</div>';
        }).join('');
        return '<section class="english-module"><div class="english-module-head"><div><h3>' + escapeHtml(module.name) + '</h3><p>' + escapeHtml(module.description) + '</p></div><span class="module-level">' + escapeHtml(module.level) + ' · ' + moduleCompleted + '/' + module.lessons.length + '</span></div><div class="english-lessons">' + lessonsHtml + '</div></section>';
      }).join('');

      const nextButton = nextLesson ? `<button class="btn" type="button" onclick="openEnglishLesson('${nextLesson.id}')">Continuar: ${escapeHtml(nextLesson.title)}</button>` : '<div class="resume-note">✓ Jornada concluída. Continue revisando as lições e praticando.</div>';
      return '<div class="english-journey-summary"><h3>Jornada de Inglês com a Bíblia</h3><p>Leia passagens conhecidas, aprenda vocabulário e pratique estruturas da língua em uma sequência que vai do essencial à leitura avançada.</p><div class="english-summary-row"><span><strong>' + completedCount + ' de ' + totalLessons + '</strong> lições concluídas</span><span>Seu ponto de partida: <strong>' + escapeHtml(level.level) + '</strong></span></div><div class="english-progress-track"><i style="width:' + percent + '%"></i></div><div class="about-cta">' + nextButton + '</div></div>' + moduleHtml;
    }

    function renderAchievements(d) {
      const earned = new Set((d.badges || []).map(badge => badge.code));
      const achievements = [
        { code: 'english_first_lesson', icon: '🔤', title: 'Primeira aula', detail: 'Conclua sua primeira lição de Inglês.' },
        { code: 'english_five_lessons', icon: '📚', title: 'Ritmo de aprendiz', detail: 'Conclua 5 lições de Inglês.' },
        { code: 'english_halfway', icon: '🌿', title: 'Meio da jornada', detail: 'Complete metade da jornada de Inglês.' },
        { code: 'english_journey_complete', icon: '🏆', title: 'Inglês concluído', detail: 'Complete as 20 lições de Inglês.' },
        { code: 'discipleship_level_2', icon: '🚶', title: 'Discípulo Caminhante', detail: 'Leia 100 capítulos no eixo Bíblia.' },
        { code: 'discipleship_level_3', icon: '🛡️', title: 'Guardião da Palavra', detail: 'Leia 400 capítulos no eixo Bíblia.' },
        { code: 'discipleship_level_4', icon: '🌟', title: 'Mestre & Discipulador', detail: 'Leia 750 capítulos no eixo Bíblia.' },
        { code: 'discipleship_level_5', icon: '🎓', title: 'Expert & Exegeta', detail: 'Conclua os 1.189 capítulos.' },
      ];
      return '<div class="achievement-grid">' + achievements.map(item => {
        const isEarned = earned.has(item.code);
        return '<div class="achievement-card ' + (isEarned ? '' : 'locked') + '"><span class="achievement-icon">' + (isEarned ? item.icon : '🔒') + '</span><div><strong>' + escapeHtml(item.title) + '</strong><small>' + escapeHtml(isEarned ? 'Conquista desbloqueada' : item.detail) + '</small></div></div>';
      }).join('') + '</div>';
    }

    function renderRanking() {
      if (!ctx.ranking) return '';
      const entries = ctx.ranking.entries || [];
      const currentUser = ctx.ranking.currentUser;
      const medal = rank => rank === 1 ? '🥇' : (rank === 2 ? '🥈' : (rank === 3 ? '🥉' : rank));
      const rows = entries.length ? entries.map(entry =>
        '<div class="ranking-row ' + (entry.userId === ctx.userId ? 'me' : '') + '"><span class="ranking-position">' + medal(entry.rank) + '</span><span class="ranking-name">' + escapeHtml(entry.displayName) + '<small>' + entry.bibleChapters + ' capítulos · ' + entry.englishLessons + ' lições de Inglês · ofensiva ' + entry.currentStreak + '</small></span><span class="ranking-score">' + entry.score + ' pts</span></div>'
      ).join('') : '<div class="empty">Complete uma lição ou capítulo para entrar no ranking.</div>';
      const current = currentUser
        ? '<div class="ranking-current">Sua posição: <strong>#' + currentUser.rank + '</strong> · ' + currentUser.score + ' pontos</div>'
        : '<div class="ranking-current">Você ainda não aparece no ranking. Comece uma lição ou capítulo.</div>';
      return '<section class="ranking-shell"><div class="ranking-head"><h3>🏅 Ranking da comunidade</h3><span>XP + prática de Inglês</span></div>' + rows + current + '</section>';
    }

    function renderApp(d) {
      const app = document.getElementById('app');
      const pct = d.progress ? d.progress.percentComplete : 0;
      const chaptersRead = d.progress ? d.progress.chaptersRead : 0;
      const total = d.totalBibleChapters;
      const resumeBook = d.progress && d.progress.lastBookUsfm && ctx.tracks
        ? ctx.tracks.bible.sections.flatMap(s => s.books).find(book => book.usfm === d.progress.lastBookUsfm)
        : null;
      const resumeNote = d.progress && d.progress.lastBookUsfm && d.progress.lastChapter
        ? '<div class="resume-note">↩ Último ponto salvo: ' + escapeHtml(resumeBook ? resumeBook.name : d.progress.lastBookUsfm) + ' · capítulo ' + d.progress.lastChapter + '</div>'
        : '';
      const bibleLevel = placementLevelFor('bible', d);
      const englishLevel = placementLevelFor('english', d);

      const disciple =
        '<div class="disciple">' +
          '<img class="mascot" src="/icons/fish.svg" alt="Mascote peixe" />' +
          '<div class="info">' +
            '<div class="era">Discípulo · ' + escapeHtml(d.discipleship.name) + '</div>' +
            '<div class="sub">Nível XP ' + escapeHtml(d.user.level) + ' · ' + chaptersRead + ' capítulos caminhados</div>' +
            '<div class="axis-levels" aria-label="Níveis por eixo">' +
              '<div class="axis-level"><span>📖 Bíblia</span><strong>Nível ' + escapeHtml(bibleLevel.level) + '</strong><small>' + escapeHtml(bibleLevel.title) + '</small></div>' +
              '<div class="axis-level"><span>🔤 Inglês</span><strong>' + escapeHtml(englishLevel.level) + '</strong><small>' + escapeHtml(englishLevel.title) + '</small></div>' +
            '</div>' +
            '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
            '<div class="bar-label"><span>' + chaptersRead + ' de ' + total + ' capítulos</span><span>' + pct + '% da Palavra</span></div>' +
            resumeNote +
          '</div>' +
        '</div>';

      const axisTabs =
        '<div class="axis-tabs">' +
          '<div class="axis-tab ' + (ctx.axis === 'bible' ? 'active' : '') + '" onclick="selectAxis(\'bible\')">📖 Bíblia</div>' +
          '<div class="axis-tab ' + (ctx.axis === 'english' ? 'active' : '') + '" onclick="selectAxis(\'english\')">🔤 Inglês</div>' +
        '</div>';

      const badges = (d.badges && d.badges.length)
        ? '<div class="badges">' + d.badges.map(b => '<div class="badge">🏅 ' + b.label + '</div>').join('') + '</div>'
        : '<div class="empty">Nenhuma insígnia ainda. Leia um capítulo para começar!</div>';

      const axis = axisDefinition(ctx.axis);
      const axisHeader =
        '<div class="axis-panel-head">' +
          '<div class="axis-panel-copy"><h2>' + (ctx.axis === 'bible' ? '📚 ' : '🔤 ') + escapeHtml(axis.name) + '</h2><p>' + escapeHtml(axis.description) + '</p></div>' +
          '<button class="placement-button" type="button" onclick="openPlacement(\'' + ctx.axis + '\')">Fazer teste de nivelamento</button>' +
        '</div>';

      let body;
      if (ctx.axis === 'english') {
        body = axisHeader + renderEnglishJourney(d);
      } else {
        body = axisHeader +
          '<div class="section-title">Trilha Principal</div>' +
          '<div class="picker-label">Seção</div>' +
          '<div class="picker">' + ctx.tracks.bible.sections.map(s =>
            '<span class="pill ' + (s.id === ctx.section ? 'active' : '') + '" onclick="selectSection(\'' + s.id + '\')">' + escapeHtml(s.name) + '</span>'
          ).join('') + '</div>' +
          '<div class="picker-label">Livro</div>' +
          '<div class="picker">' + currentSection().books.map(b =>
            '<span class="pill book-pill ' + (b.usfm === ctx.book ? 'active' : '') + '" onclick="selectBook(\'' + b.usfm + '\')"><span>' + escapeHtml(b.name) + '</span><small>' + b.chapters + ' cap.</small></span>'
          ).join('') + '</div>' +
          '<div class="path" id="path"></div>' +
          renderThematic();
      }

      app.innerHTML = disciple + axisTabs + body +
        '<div class="section-title">🏆 Conquistas</div>' + renderAchievements(d) +
        '<div class="section-title">🏅 Insígnias e marcos</div>' + badges +
        renderRanking();

      if (ctx.axis === 'bible') renderPath(d);
    }

    function renderThematic() {
      const themes = (ctx.tracks && ctx.tracks.thematic) || [];
      if (!themes.length) return '';
      return '<div class="section-title">✨ Trilhas Temáticas</div>' +
        themes.map(t =>
          '<div class="theme-card"><h4>' + t.name + '</h4><p>' + t.description + '</p>' +
          '<div class="theme-refs">' + t.references.map(r =>
            '<span class="ref-chip" onclick="openRef(\'' + r + '\')">' + r.replace('.', ' ') + '</span>'
          ).join('') + '</div></div>'
        ).join('');
    }

    function renderPath(d) {
      const book = currentBook();
      const read = readCountFor(d, book.usfm);
      let html = '';
      for (let i = 1; i <= book.chapters; i++) {
        const done = i <= read;
        const locked = i > read + 1;
        const cls = done ? 'done' : (locked ? 'locked' : '');
        const check = done ? '<span class="check">✓</span>' : '';
        const onclick = locked ? '' : 'onclick="openChapter(\'' + book.usfm + '\',' + i + ')"';
        const inner = done ? '<img src="/icons/lamp.svg" alt="concluído" />' : i;
        html += '<div class="node-row"><div>' +
            '<button class="node ' + cls + '" ' + onclick + '>' + inner + check + '</button>' +
            '<div class="node-cap">Cap. ' + i + '</div>' +
          '</div></div>';
      }
      document.getElementById('path').innerHTML = html;
    }

    function selectAxis(axis) { ctx.axis = axis; renderApp(ctx.dashboard); }
    function placementResultFor(axis, score) {
      const index = Math.max(0, Math.min((PLACEMENT_LEVELS[axis] || []).length - 1, score));
      const definition = PLACEMENT_LEVELS[axis][index];
      return { level: definition.level, title: definition.title, description: definition.description, score };
    }

    function renderPlacementQuestion() {
      const placement = ctx.placement;
      const questions = PLACEMENT_QUESTIONS[placement.axis];
      const question = questions[placement.index];
      const axis = axisDefinition(placement.axis);
      document.getElementById('q-title').textContent = 'Teste de nivelamento · ' + axis.name;
      document.getElementById('q-ref').textContent = 'Descubra seu ponto de partida';
      document.getElementById('q-body').innerHTML =
        '<div class="placement-progress">Pergunta ' + (placement.index + 1) + ' de ' + questions.length + '</div>' +
        '<div class="placement-question">' + escapeHtml(question.question) + '</div>' +
        question.options.map((option, index) =>
          '<button class="placement-option ' + (placement.selected === index ? 'sel' : '') + '" type="button" data-placement-idx="' + index + '" onclick="selectPlacementOption(' + index + ')">' + escapeHtml(option) + '</button>'
        ).join('');
      document.getElementById('q-confirm').textContent = placement.index === questions.length - 1 ? 'Ver meu nível' : 'Próxima pergunta';
      document.getElementById('q-confirm').disabled = placement.selected === null;
      document.getElementById('q-skip').textContent = 'Cancelar teste';
    }

    function openPlacement(axis) {
      ctx.placement = { axis, index: 0, score: 0, selected: null, result: null };
      document.getElementById('overlay').classList.add('open');
      renderPlacementQuestion();
    }

    function selectPlacementOption(index) {
      if (!ctx.placement || ctx.placement.result) return;
      ctx.placement.selected = index;
      document.querySelectorAll('.placement-option').forEach(el => el.classList.toggle('sel', Number(el.dataset.placementIdx) === index));
      document.getElementById('q-confirm').disabled = false;
    }

    function advancePlacement() {
      const placement = ctx.placement;
      if (!placement || placement.selected === null) return;
      const questions = PLACEMENT_QUESTIONS[placement.axis];
      if (placement.selected === questions[placement.index].correctIndex) placement.score += 1;

      if (placement.index < questions.length - 1) {
        placement.index += 1;
        placement.selected = null;
        renderPlacementQuestion();
        return;
      }

      placement.result = placementResultFor(placement.axis, placement.score);
      savePlacementLevel(placement.axis, placement.result);
      const axis = axisDefinition(placement.axis);
      document.getElementById('q-title').textContent = 'Nivelamento concluído';
      document.getElementById('q-ref').textContent = axis.name;
      document.getElementById('q-body').innerHTML =
        '<div class="placement-result"><div class="muted">Seu nível de partida</div>' +
        '<div class="level-mark">' + escapeHtml(placement.result.level) + '</div>' +
        '<h3>' + escapeHtml(placement.result.title) + '</h3>' +
        '<p>' + escapeHtml(placement.result.description) + '</p>' +
        '<p class="muted">Você acertou ' + placement.result.score + ' de ' + questions.length + ' perguntas.</p></div>';
      document.getElementById('q-confirm').textContent = 'Fechar';
      document.getElementById('q-confirm').disabled = false;
      document.getElementById('q-skip').textContent = 'Refazer teste';
      renderApp(ctx.dashboard);
    }

    function confirmModal() {
      if (ctx.placement) {
        if (ctx.placement.result) closeModal();
        else advancePlacement();
        return;
      }
      if (ctx.englishLesson) {
        completeEnglishLesson();
        return;
      }
      completeChapter(true);
    }

    function skipModal() {
      if (ctx.placement) {
        if (ctx.placement.result) openPlacement(ctx.placement.axis);
        else closeModal();
        return;
      }
      if (ctx.englishLesson) {
        closeModal();
        return;
      }
      completeChapter(false);
    }

    function selectSection(id) {
      ctx.section = id;
      ctx.book = currentSection().books[0].usfm;
      renderApp(ctx.dashboard);
    }
    function selectBook(usfm) { ctx.book = usfm; renderApp(ctx.dashboard); }

    // Abre lição por referência USFM completa (ex.: 'PRO.3') vinda das temáticas.
    function openRef(ref) {
      const [usfm, ch] = ref.split('.');
      openChapter(usfm, Number(ch));
    }

    async function openChapter(usfm, chapter) {
      const ref = usfm + '.' + chapter;
      setBookContext(usfm);
      ctx.current = { usfm, chapter, ref, selected: null, quiz: null };
      await saveLastPosition(usfm, chapter);

      ctx.placement = null;
      document.getElementById('q-title').textContent = 'Lição: ' + ref.replace('.', ' ');
      document.getElementById('q-ref').textContent = 'Leitura + Tutor de IA';
      document.getElementById('q-skip').textContent = 'Ler sem quiz';
      document.getElementById('q-body').innerHTML = '<p class="q">Carregando a Palavra e o Tutor...</p>';
      document.getElementById('q-confirm').disabled = true;
      document.getElementById('overlay').classList.add('open');

      const lang = 'pt';
      const [passage, summary, quiz] = await Promise.all([
        api('/api/bible/passage?ref=' + ref + '&language=' + lang).catch(() => null),
        api('/api/ai/chapter-summary?ref=' + ref + '&language=' + lang).catch(() => null),
        api('/api/ai/quiz?ref=' + ref + '&language=' + lang).catch(() => []),
      ]);

      ctx.current.quiz = (Array.isArray(quiz) && quiz.length) ? quiz[0] : null;

      const textBlock = passage
        ? '<div class="scripture"><div class="scripture-ref">' + (passage.reference || ref) + '</div><p>' + escapeHtml(passage.content || '') + '</p></div>'
        : '<div class="scripture"><p class="muted">Texto indisponível no momento.</p></div>';

      const aiBlock = summary
        ? '<div class="ai-card"><div class="ai-tag">🤖 Tutor IA (bilíngue)</div>' +
          '<p><strong>PT:</strong> ' + escapeHtml(summary.summaryPt || '') + '</p>' +
          '<p><strong>EN:</strong> ' + escapeHtml(summary.summaryEn || '') + '</p>' +
          (summary.application ? '<p class="apply">🙏 ' + escapeHtml(summary.application) + '</p>' : '') +
          '</div>'
        : '';

      let quizBlock = '';
      if (ctx.current.quiz) {
        const q = ctx.current.quiz;
        quizBlock = '<div class="quiz-card"><p class="q">' + escapeHtml(q.question) + '</p>' +
          q.options.map((o, idx) => '<button class="opt" data-idx="' + idx + '" onclick="selectOpt(' + idx + ')">' + escapeHtml(o) + '</button>').join('') +
          '</div>';
      }

      document.getElementById('q-body').innerHTML = textBlock + aiBlock + quizBlock;
      document.getElementById('q-confirm').disabled = ctx.current.quiz ? true : false;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function selectOpt(idx) {
      ctx.current.selected = idx;
      document.querySelectorAll('.opt').forEach(el => el.classList.toggle('sel', Number(el.dataset.idx) === idx));
      document.getElementById('q-confirm').disabled = false;
    }

    function closeModal() {
      document.getElementById('overlay').classList.remove('open');
      ctx.placement = null;
      ctx.englishLesson = null;
    }

    async function completeChapter(withQuiz) {
      const { usfm, chapter, selected, quiz } = ctx.current;
      const quizPassed = withQuiz && !!quiz && selected === quiz.answerIndex;
      try {
        const r = await api('/api/progress/complete-chapter', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: ctx.userId, challengeId: ctx.challengeId,
            bookUsfm: usfm, chapter, language: 'pt', quizPassed,
          }),
        });
        closeModal();
        let msg = '+' + r.xpAwarded + ' XP';
        if (r.bookCompleted) msg += ' · Livro concluído! 📗';
        if (r.badgesAwarded && r.badgesAwarded.length) msg += ' · ' + r.badgesAwarded.join(', ');
        toast(msg);
        await refresh();
      } catch (e) {
        if (e.data && e.data.error && e.data.error.code === 'CHAPTER_ALREADY_COMPLETED') {
          closeModal(); toast('Capítulo já concluído 🙏'); await refresh();
        } else {
          toast('Erro ao concluir. Tente de novo.');
        }
      }
    }

    document.getElementById('q-confirm').onclick = confirmModal;
    document.getElementById('q-skip').onclick = skipModal;
    document.getElementById('overlay').onclick = (e) => { if (e.target.id === 'overlay') closeModal(); };

    bootstrap().catch(err => {
      document.getElementById('app').innerHTML =
        '<div class="loading">Não foi possível iniciar. Verifique se o banco está configurado.<br><small>' +
        (err && err.data && err.data.error ? err.data.error.message : 'Erro desconhecido') + '</small></div>';
    });
  </script>
</body>
</html>
