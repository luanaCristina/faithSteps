<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Peixe (Ichthys)">
  <defs>
    <linearGradient id="fishBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6bff"/>
      <stop offset="1" stop-color="#5b3fd6"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="58" fill="#241a4a"/>
  <!-- Corpo do peixe Ichthys: duas curvas que se cruzam formando a cauda -->
  <g transform="translate(6,4)">
    <path d="M18 60 C 40 26, 78 26, 96 46 C 102 40, 108 34, 112 30
             C 106 44, 106 54, 112 68 C 108 64, 102 58, 96 52
             C 78 72, 40 72, 18 60 Z"
          fill="url(#fishBody)" stroke="#c9b7ff" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Olho -->
    <circle cx="40" cy="52" r="4.2" fill="#fff"/>
    <circle cx="41" cy="52.5" r="2" fill="#241a4a"/>
    <!-- Brilho suave no corpo -->
    <path d="M52 42 C 66 38, 80 42, 88 48" fill="none" stroke="#e7deff" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
