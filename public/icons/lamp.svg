<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Candeeiro (Lampada de Azeite)">
  <defs>
    <radialGradient id="flame" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.6" stop-color="#ffc800"/>
      <stop offset="1" stop-color="#ff9500"/>
    </radialGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a349"/>
      <stop offset="1" stop-color="#b06f24"/>
    </linearGradient>
  </defs>
  <!-- Halo de luz -->
  <circle cx="20" cy="12" r="9" fill="#ffc800" opacity="0.18"/>
  <!-- Chama -->
  <path d="M20 4 C 23 8, 24 11, 20 14 C 16 11, 17 8, 20 4 Z" fill="url(#flame)"/>
  <!-- Corpo do candeeiro de azeite (bico + reservatorio) -->
  <path d="M6 30 C 6 24, 12 22, 22 22 C 34 22, 42 24, 42 28
           C 42 33, 34 36, 24 36 C 16 36, 10 34, 6 30 Z" fill="url(#clay)" stroke="#8a531a" stroke-width="1.4"/>
  <!-- Bico com pavio -->
  <path d="M40 26 L 46 22 L 44 28 Z" fill="url(#clay)" stroke="#8a531a" stroke-width="1.2"/>
  <line x1="44" y1="24" x2="46" y2="21" stroke="#3a2a12" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Base -->
  <path d="M14 36 L 34 36 L 30 40 L 18 40 Z" fill="#8a531a"/>
</svg>
